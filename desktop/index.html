<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SLBP</title>
  </head>
  <body>
    <div id="titlebar" class="titlebar">
      <div id="tab-strip" class="tab-strip"></div>
      <button id="tab-dashboard-btn" class="tab-dashboard-btn" title="Open Dashboard">+ Dashboard</button>
      <div class="window-controls">
        <button id="win-minimize" class="win-btn" title="Minimize">&#8211;</button>
        <button id="win-maximize" class="win-btn" title="Maximize">&#9633;</button>
        <button id="win-close" class="win-btn win-btn-close" title="Close">&#215;</button>
      </div>
    </div>
    <div id="health-panel" class="health-panel hidden">
      <div class="health-status-row">
        <span id="health-status-badge" class="health-badge health-badge-checking">Checking&hellip;</span>
        <span id="health-status-detail" class="health-detail"></span>
        <button id="health-process-doctor" class="health-process-doctor">Process Doctor</button>
        <button id="health-restart-server" class="health-restart-server">Restart Server</button>
        <button id="health-open-dashboard" class="health-open-dashboard" disabled>Open Dashboard</button>
        <span id="health-version" class="health-version"></span>
        <button id="health-changelog-btn" class="health-changelog-btn" title="View all changelogs">Changelogs</button>
      </div>
      <pre id="health-log" class="health-log"></pre>
      <div class="health-log-footer">
        <span id="health-log-path" class="health-log-path"></span>
        <button id="health-copy-log-path" class="health-copy-btn" title="Copy log file path">⧉</button>
      </div>
    </div>
    <dialog id="changelog-dialog" class="changelog-dialog">
      <div class="changelog-header">
        <span class="changelog-title">Desktop Changelogs</span>
        <button id="changelog-close" class="changelog-close" title="Close">&#215;</button>
      </div>
      <div id="changelog-body" class="changelog-body"></div>
    </dialog>
    <dialog id="process-doctor-dialog" class="process-doctor-dialog">
      <div class="process-doctor-header">
        <div>
          <div class="process-doctor-title">Process Doctor</div>
          <div class="process-doctor-subtitle">Inspect and clean up orphaned SLBP server processes</div>
        </div>
        <button id="process-doctor-close" class="process-doctor-close" title="Close">&#215;</button>
      </div>
      <div id="process-doctor-terminal" class="process-doctor-terminal"></div>
    </dialog>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
